# Ensure Bluetooth headsets expose their microphone and switch from A2DP to
# native HFP only while a capture stream is active.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
  bluez5.hfphsp-backend = "native"
}

wireplumber.settings = {
  bluetooth.use-persistent-storage = true
  bluetooth.autoswitch-to-headset-profile = true
  device.routes.default-source-volume = 1.0
}
